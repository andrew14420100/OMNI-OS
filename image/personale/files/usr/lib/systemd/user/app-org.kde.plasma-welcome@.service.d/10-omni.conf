# Nella sessione OMNI il Centro di benvenuto di Plasma non parte: è un'app di Plasma
# (circa 1 GB di memoria nella VM di prova) che al primo accesso rallentava le prime app
# aperte dall'utente. Nella modalità sicura (desktop Plasma) parte normalmente.
[Service]
ExecCondition=/usr/libexec/omni-os/omni-session-check plasma
