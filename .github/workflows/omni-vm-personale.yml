# OMNI OS — pacchetto VM personale (anteprima sperimentale, non M2/M3/M4).
# Produce un disco VMDK da usare in VirtualBox/VMware su Windows 11: OMNI OS (base B3
# verificata) con OMNI Shell V2 avviata automaticamente nella sessione Plasma Wayland.
# Il disco NON contiene chiavi, utenti o password: l'account si crea al primo avvio.
# Nessuna release, nessun registry: il disco è solo un artifact di questa esecuzione.
name: omni-vm-personale

on:
  workflow_dispatch:
    inputs:
      vhdx:
        description: "Produce anche un disco VHDX (Hyper-V)"
        type: boolean
        default: false
  push:
    branches: ["claude/omni-vm-personale"]
    paths: [".github/workflows/omni-vm-personale.yml"]

permissions:
  contents: read

concurrency:
  group: omni-vm-personale-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vm:
    name: Pacchetto VM personale (build, prova reale, sicurezza, VMDK)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { persist-credentials: false }
      - name: Chiave della cache della base B3
        id: key
        run: echo "key=omni-base-b3-$(grep -E '^OSTREE_COMMIT=' image/base.lock | cut -d= -f2)-v1" >> "$GITHUB_OUTPUT"
      - name: Ripristino della base B3 dalla cache di questo branch (se presente)
        id: cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/base-b3
          key: ${{ steps.key.outputs.key }}
      - name: Preparazione e verifica della base B3 (solo se non in cache)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          bash tests/vm/base_b3.sh prepare "$RUNNER_TEMP/base-b3"
          bash tests/vm/base_b3.sh import "$RUNNER_TEMP/base-b3"
          bash tests/vm/base_b3_negative.sh "$RUNNER_TEMP/base-b3"
          sudo rm -rf "$RUNNER_TEMP/base-b3.work"
      - name: Salvataggio della base nella cache di questo branch (non pubblica)
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/base-b3
          key: ${{ steps.key.outputs.key }}
      - name: Preparazione (base B3 verificata, KVM, QEMU)
        run: bash tests/vm/ci_prepare.sh
      - name: Immagine OMNI di base e OMNI Shell (Qt di Fedora 45, test inclusi)
        run: |
          set -euo pipefail
          . tests/vm/lib.sh
          build_image 0.2.0-vm-personale localhost/omni-os:m1-ci
          bash tests/vm/build_shell_bundle.sh localhost/omni-os:m1-ci "$RUNNER_TEMP/shell"
          rm -rf image/personale/omni-shell && cp -r "$RUNNER_TEMP/shell/pkg" image/personale/omni-shell
          ls image/personale/omni-shell
      - name: Immagine OMNI personale (con OMNI Shell)
        run: |
          set -euo pipefail
          $PODMAN build --build-arg OMNI_IMAGE=localhost/omni-os:m1-ci -t localhost/omni-os:personale image/personale/ 2>&1 | tail -5
          $PODMAN image inspect --format '{{.Id}} {{.Created}}' localhost/omni-os:personale | tee "$RUNNER_TEMP/immagine-personale.txt"
      - name: SBOM dell'immagine personale
        run: |
          set -euo pipefail
          # Prima dei passi con VM: disco e memoria del runner ancora liberi (la run
          # 42583327356 è stata interrotta durante questo passo, eseguito alla fine).
          df -h / "$RUNNER_TEMP" | tail -n +1; free -g
          mkdir -p "$RUNNER_TEMP/out"
          bash tests/ci/fetch_tool.sh syft
          $PODMAN save --format oci-archive -o "$RUNNER_TEMP/personale.tar" localhost/omni-os:personale
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/personale.tar"
          SYFT_CHECK_FOR_APP_UPDATE=false "$RUNNER_TEMP/bin/syft" scan "oci-archive:$RUNNER_TEMP/personale.tar" -q -o "spdx-json=$RUNNER_TEMP/out/omni-os-vm-personale.spdx.json"
          rm -f "$RUNNER_TEMP/personale.tar"
      - name: Disco di prova (stessa immagine + chiave effimera) e prova reale
        timeout-minutes: 45
        run: |
          set +e
          bash tests/vm/make_disk.sh localhost/omni-os:personale "$VMWORK" "$TESTKEY.pub" || exit 1
          sudo chown "$(id -u):$(id -g)" "$VMWORK/disk.raw"; mv "$VMWORK/disk.raw" "$VMWORK/disk-pristine.raw"
          bash tests/vm/personale_test.sh "$VMWORK/personale"; rc=$?
          cat "$VMWORK/personale/personale.md" >> "$GITHUB_STEP_SUMMARY" || true
          rm -f "$VMWORK/disk-pristine.raw" "$VMWORK/personale/disk.raw"
          exit $rc
      - name: Disco PERSONALE (senza chiavi né utenti) e controlli di sicurezza
        timeout-minutes: 30
        run: |
          set +e
          out=$RUNNER_TEMP/out; mkdir -p "$out"
          bash tests/vm/make_disk.sh localhost/omni-os:personale "$out" none || exit 1
          sudo chown "$(id -u):$(id -g)" "$out/disk.raw"
          bash tests/vm/personale_sicurezza.sh "$out/disk.raw" "$TESTKEY.pub" "$VMWORK/sicurezza"; rc=$?
          df -h / "$RUNNER_TEMP" | tail -n +1
          cat "$VMWORK/sicurezza/sicurezza.md" >> "$GITHUB_STEP_SUMMARY" || true
          exit $rc
      - name: Primo avvio del disco personale (su una copia) - schermata di creazione dell'account
        timeout-minutes: 15
        run: |
          set -euo pipefail
          w=$VMWORK/primo-avvio; mkdir -p "$w"
          cp --sparse=always "$RUNNER_TEMP/out/disk.raw" "$w/disk.raw"
          VM_TABLET=1 bash tests/vm/boot_vm.sh "$w/disk.raw" "$w" uefi
          sleep 180
          python3 tests/vm/qmp.py "$w/qmp.sock" screendump "$w/primo-avvio.png"
          kill "$(cat "$w/qemu.pid")" || true; sleep 3; rm -f "$w/disk.raw"
          sz=$(stat -c %s "$w/primo-avvio.png"); echo "schermata del primo avvio: $sz byte"
          [ "$sz" -gt 15000 ] || { echo "schermata quasi vuota: il desktop di configurazione non è comparso"; exit 1; }
      - name: Conversione in VMDK (VirtualBox, VMware) e somme di controllo
        run: |
          set -euo pipefail
          o=$RUNNER_TEMP/pacchetto; mkdir -p "$o"
          qemu-img convert -p -O vmdk -o subformat=streamOptimized "$RUNNER_TEMP/out/disk.raw" "$o/OMNI-OS-0.2.0-vm-personale.vmdk"
          if [ "${{ inputs.vhdx }}" = true ]; then
            qemu-img convert -O vhdx -o subformat=dynamic "$RUNNER_TEMP/out/disk.raw" "$o/OMNI-OS-0.2.0-vm-personale.vhdx"
          fi
          rm -f "$RUNNER_TEMP/out/disk.raw"
          cp "$RUNNER_TEMP/out/omni-os-vm-personale.spdx.json" docs/13-vm-personale/LEGGIMI.md "$o/"
          cp "$VMWORK/sicurezza/sicurezza.md" "$o/controlli-di-sicurezza.md"
          (cd "$o" && sha256sum ./*.vmdk ./*.vhdx ./*.json ./*.md 2>/dev/null > SHA256SUMS.txt)
          cat "$o/SHA256SUMS.txt"; ls -lh "$o"
          { echo "## Pacchetto"; echo; echo '```'; cat "$o/SHA256SUMS.txt"; ls -lh "$o"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Pacchetto VM personale (14 giorni, solo per chi ha accesso al repository)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: OMNI-OS-0.2.0-VM-personale
          path: ${{ runner.temp }}/pacchetto/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Evidenze (schermate e registri)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: OMNI-OS-VM-personale-evidenze
          path: |
            ${{ runner.temp }}/vm/personale/schermate/
            ${{ runner.temp }}/vm/personale/*.md
            ${{ runner.temp }}/vm/personale/*.txt
            ${{ runner.temp }}/vm/personale/*.log
            ${{ runner.temp }}/vm/sicurezza/*.md
            ${{ runner.temp }}/vm/sicurezza/*.txt
            ${{ runner.temp }}/vm/primo-avvio/primo-avvio.png
            ${{ runner.temp }}/immagine-personale.txt
          retention-days: 14
          if-no-files-found: ignore
