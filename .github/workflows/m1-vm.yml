# OMNI OS — M1: verifica del runner, build sperimentale (P1–P4) e avvio in VM (P5–P7).
# Prototipo SOLO per macchina virtuale. Nessuna pubblicazione su registry,
# nessuna release, nessuna ISO, nessun segreto, nessuna chiave definitiva.
# Percorso approvato: docs/11-m1/percorso-build-vm.md (decisione M1-D2).
name: m1-vm

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - "image/**"
      - "tests/vm/**"
      - "tests/static/check_image.sh"
      - ".github/workflows/m1-vm.yml"

permissions:
  contents: read

concurrency:
  group: m1-vm-${{ github.ref }}
  cancel-in-progress: true

env:
  OMNI_VERSION: 0.1.0-m1-dev
  IMAGE_REF: localhost/omni-os:m1-ci

jobs:
  runner-check:
    name: Verifica del runner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      kvm: ${{ steps.check.outputs.kvm }}
      free_gb: ${{ steps.check.outputs.free_gb }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Risorse prima della pulizia
        run: MIN_FREE_GB=0 bash tests/vm/runner_check.sh
      - name: Abilita /dev/kvm per l'utente del runner (se presente)
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            ls -l /dev/kvm
          else
            echo "/dev/kvm assente"
          fi
      - name: Verifica finale delle risorse
        id: check
        run: MIN_FREE_GB=0 bash tests/vm/runner_check.sh

  build-p1-p4:
    name: P1–P7 base, build, lint, contenuto, disco, avvio UEFI, schermata
    needs: runner-check
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Base approvata e fissata per digest
        id: lock
        run: |
          set -euo pipefail
          out=$(bash tests/static/check_image.sh)
          echo "$out"
          echo "$out" | grep -qx 'BUILD_ALLOWED=true' || { echo "Build non consentita"; exit 1; }
          echo "base=$(grep -E '^BASE_IMAGE=' image/base.lock | cut -d= -f2-)" >> "$GITHUB_OUTPUT"

      - name: Libera spazio sul runner
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / /mnt || true

      - name: Risorse dopo la pulizia (minimo 30 GB)
        id: res
        run: MIN_FREE_GB=30 bash tests/vm/runner_check.sh

      - name: Configura lo storage di podman
        run: |
          set -euo pipefail
          sudo mkdir -p "${{ steps.res.outputs.storage_dir }}"
          echo "PODMAN=sudo podman --root ${{ steps.res.outputs.storage_dir }}" >> "$GITHUB_ENV"
          sudo podman --version

      - name: "P1: ricontrollo del digest e download della base"
        run: |
          set -euo pipefail
          base='${{ steps.lock.outputs.base }}'
          want=${base#*@}
          # Il tag mobile 45 punta ancora al digest approvato? (informativo)
          sudo skopeo inspect --raw docker://quay.io/fedora/fedora-kinoite:45 \
            | jq -r '.manifests[] | select(.platform.architecture=="amd64") | .digest' > tag45.txt || true
          echo "Digest amd64 attuale del tag 45: $(cat tag45.txt 2>/dev/null || echo 'non letto')"
          echo "Digest approvato:                $want"
          $PODMAN pull "$base"
          got=$($PODMAN image inspect --format '{{.Digest}}' "$base")
          echo "Digest scaricato: $got"
          [ "$got" = "$want" ] || { echo "ERRORE: digest diverso da quello approvato"; exit 1; }
          $PODMAN image inspect --format '{{index .Labels "org.opencontainers.image.version"}} {{index .Labels "containers.bootc"}} {{index .Labels "ostree.linux"}}' "$base"

      - name: "P2: build dell'immagine OMNI (include bootc container lint)"
        run: |
          set -euo pipefail
          $PODMAN build \
            --build-arg BASE_IMAGE='${{ steps.lock.outputs.base }}' \
            --build-arg OMNI_VERSION="$OMNI_VERSION" \
            -t "$IMAGE_REF" image/
          $PODMAN image inspect --format 'ID {{.Id}}  creata {{.Created}}' "$IMAGE_REF"

      - name: "P3: bootc container lint (esplicito)"
        run: $PODMAN run --rm "$IMAGE_REF" bootc container lint

      - name: "P4: verifica del contenuto"
        run: |
          $PODMAN run --rm -v "$PWD/tests/vm:/t:ro,Z" "$IMAGE_REF" \
            bash /t/check_image_content.sh "$OMNI_VERSION"

      # ---- P5–P7: eseguiti solo se P1–P4 sono superati (i passi falliti fermano il job) ----
      - name: Prerequisiti VM (QEMU, OVMF) e chiave SSH effimera di prova
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf >/dev/null
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          test -w /dev/kvm || { echo "ERRORE: /dev/kvm non accessibile"; exit 1; }
          qemu-system-x86_64 --version | head -1
          ls /usr/share/OVMF/
          # Chiave effimera: generata qui, mai salvata né pubblicata, distrutta con il runner.
          ssh-keygen -q -t ed25519 -N '' -C omni-m1-ci-effimera -f "$RUNNER_TEMP/testkey"
          echo "VMWORK=$RUNNER_TEMP/vm" >> "$GITHUB_ENV"
          echo "TESTKEY=$RUNNER_TEMP/testkey" >> "$GITHUB_ENV"

      - name: "P5: disco virtuale di prova (bootc install to-disk)"
        run: |
          set -euo pipefail
          storage=$(echo "$PODMAN" | awk '{print $4}')
          bash tests/vm/make_disk.sh "$storage" "$IMAGE_REF" "$VMWORK" "$TESTKEY.pub"
          sudo chown "$(id -u):$(id -g)" "$VMWORK/disk.raw"

      - name: "P6: avvio UEFI in QEMU e controlli nel sistema avviato"
        run: |
          set -euo pipefail
          bash tests/vm/boot_vm.sh "$VMWORK/disk.raw" "$VMWORK" uefi
          bash tests/vm/wait_ssh.sh "$TESTKEY" "$VMWORK" 900
          scp -i "$TESTKEY" -P 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR \
            tests/vm/vm_checks.sh root@127.0.0.1:/var/tmp/vm_checks.sh
          # attende che la sessione grafica si stabilizzi prima dei controlli
          for i in $(seq 1 30); do
            bash tests/vm/vm_ssh.sh "$TESTKEY" systemctl is-active display-manager >/dev/null 2>&1 && break
            sleep 10
          done
          bash tests/vm/vm_ssh.sh "$TESTKEY" bash /var/tmp/vm_checks.sh "$OMNI_VERSION"

      - name: "P7: cattura della schermata di accesso"
        run: |
          set -euo pipefail
          sleep 30
          python3 tests/vm/screenshot.py "$VMWORK/qmp.sock" "$VMWORK/p7-schermata.png"
          ls -l "$VMWORK/p7-schermata.png"

      - name: Arresto della VM
        if: always()
        run: |
          if [ -f "${VMWORK:-/nonexistent}/qemu.pid" ]; then kill "$(cat "$VMWORK/qemu.pid")" 2>/dev/null || true; fi

      - name: Artefatti di diagnosi (schermata e console seriale, 3 giorni)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m1-vm-diagnosi
          path: |
            ${{ runner.temp }}/vm/p7-schermata.png
            ${{ runner.temp }}/vm/serial.log
          retention-days: 3
          if-no-files-found: ignore

      - name: Spazio usato
        if: always()
        run: df -h / /mnt || true
