# OMNI OS — CI M1 (solo controlli statici).
# Nessuna build di immagini, nessuna VM, nessun segreto, nessuna pubblicazione.
# La build sarà aggiunta solo dopo l'approvazione della base OCI e del percorso
# di build (docs/11-m1/percorso-build-vm.md).
name: ci-statica

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controlli-statici:
    name: Controlli statici
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Documentazione, segreti, blocco della base
        run: bash tests/run_static.sh

      - name: Strumenti di lint (versioni e checksum fissati)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSLf -o "$RUNNER_TEMP/bin/hadolint" \
            https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          echo "56de6d5e5ec427e17b74fa48d51271c7fc0d61244bf5c90e828aab8362d55010  $RUNNER_TEMP/bin/hadolint" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/hadolint"
          curl -sSLf -o "$RUNNER_TEMP/sc.tar.xz" \
            https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz
          echo "6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87  $RUNNER_TEMP/sc.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/sc.tar.xz" -C "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/shellcheck-v0.10.0/shellcheck" "$RUNNER_TEMP/bin/"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Lint Containerfile
        run: hadolint image/Containerfile

      - name: Lint script shell
        run: shellcheck tests/run_static.sh tests/static/*.sh tests/vm/*.sh
