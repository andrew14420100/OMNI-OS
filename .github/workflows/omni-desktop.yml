# OMNI OS — desktop reale (anteprima sperimentale, non M2/M3/M4).
# fase=base: misure della versione di riferimento 0.2.0 (commit 90b9656), nessuna modifica.
# fase=nuova: costruzione, prove funzionali e misure della nuova versione, pacchetto VM.
# fase=entrambe: le due insieme, per il confronto prima/dopo nelle stesse condizioni.
# Nessuna release, nessun registry: dischi e misure sono solo artifact di questa esecuzione.
name: omni-desktop

on:
  workflow_dispatch:
    inputs:
      fase:
        description: "base | nuova | entrambe"
        type: choice
        options: [base, nuova, entrambe]
        default: entrambe
      pacchetto:
        description: "Produce il pacchetto VM scaricabile (solo se tutte le prove passano)"
        type: boolean
        default: false
  push:
    branches: ["claude/omni-desktop-reale"]
    paths: [".github/workflows/omni-desktop.yml"]

permissions:
  contents: read

concurrency:
  group: omni-desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  FASE: ${{ inputs.fase || 'base' }}
  RIFERIMENTO: 90b96561e59478cdc1896aa7504a8ba841b2d1fb

jobs:
  desktop:
    name: Desktop reale (misure, prove, pacchetto)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: Chiave della cache della base B3
        id: key
        run: echo "key=omni-base-b3-$(grep -E '^OSTREE_COMMIT=' image/base.lock | cut -d= -f2)-v1" >> "$GITHUB_OUTPUT"
      - name: Ripristino della base B3 dalla cache di questo branch (se presente)
        id: cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/base-b3
          key: ${{ steps.key.outputs.key }}
      - name: Preparazione e verifica della base B3 (solo se non in cache)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          bash tests/vm/base_b3.sh prepare "$RUNNER_TEMP/base-b3"
          bash tests/vm/base_b3.sh import "$RUNNER_TEMP/base-b3"
          bash tests/vm/base_b3_negative.sh "$RUNNER_TEMP/base-b3"
          sudo rm -rf "$RUNNER_TEMP/base-b3.work"
      - name: Salvataggio della base nella cache di questo branch (non pubblica)
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/base-b3
          key: ${{ steps.key.outputs.key }}
      - name: Preparazione (base B3 verificata, KVM, QEMU)
        run: bash tests/vm/ci_prepare.sh

      - name: "Prima: immagine 0.2.0 di riferimento (commit fissato)"
        if: env.FASE != 'nuova'
        run: |
          set -euo pipefail
          git worktree add "$RUNNER_TEMP/rif" "$RIFERIMENTO"
          bash tests/vm/build_personale.sh "$RUNNER_TEMP/rif" localhost/omni-os:rif 0.2.0-vm-personale
      - name: "Prima: misure della 0.2.0 in VM 4K (scala 200%)"
        if: env.FASE != 'nuova'
        timeout-minutes: 75
        run: |
          set +e
          bash tests/vm/make_disk.sh localhost/omni-os:rif "$VMWORK" "$TESTKEY.pub" || exit 1
          sudo chown "$(id -u):$(id -g)" "$VMWORK/disk.raw"; mv "$VMWORK/disk.raw" "$VMWORK/disk-pristine.raw"
          bash tests/vm/prestazioni.sh "$VMWORK/prima" "0.2.0 (prima)"; rc=$?
          cat "$VMWORK/prima/prestazioni.md" >> "$GITHUB_STEP_SUMMARY" || true
          rm -f "$VMWORK/disk-pristine.raw" "$VMWORK/prima/disk.raw"
          echo "rc_prima=$rc" >> "$GITHUB_ENV"
          exit 0
      - name: "Dopo: immagine 0.3.0 (desktop OMNI)"
        if: env.FASE != 'base'
        run: bash tests/vm/build_personale.sh . localhost/omni-os:nuova 0.3.0-desktop-reale
      - name: "Dopo: prove reali del desktop OMNI in VM 4K"
        if: env.FASE != 'base'
        timeout-minutes: 90
        run: |
          set +e
          bash tests/vm/make_disk.sh localhost/omni-os:nuova "$VMWORK" "$TESTKEY.pub" || exit 1
          sudo chown "$(id -u):$(id -g)" "$VMWORK/disk.raw"; mv "$VMWORK/disk.raw" "$VMWORK/disk-pristine.raw"
          bash tests/vm/omni_desktop_test.sh "$VMWORK/dopo-prove"; rc=$?
          cat "$VMWORK/dopo-prove/desktop.md" >> "$GITHUB_STEP_SUMMARY" || true
          rm -f "$VMWORK/dopo-prove/disk.raw"
          echo "rc_prove=$rc" >> "$GITHUB_ENV"
          exit 0
      - name: "Dopo: misure della 0.3.0 (stessa procedura della 0.2.0)"
        if: env.FASE != 'base'
        timeout-minutes: 75
        run: |
          set +e
          bash tests/vm/prestazioni.sh "$VMWORK/dopo" "0.3.0 (dopo)"; rc=$?
          cat "$VMWORK/dopo/prestazioni.md" >> "$GITHUB_STEP_SUMMARY" || true
          rm -f "$VMWORK/disk-pristine.raw" "$VMWORK/dopo/disk.raw"
          echo "rc_dopo=$rc" >> "$GITHUB_ENV"
          exit 0
      - name: Confronto prima/dopo
        if: env.FASE == 'entrambe'
        run: |
          python3 tests/vm/confronto.py "$VMWORK/prima/misure.tsv" "$VMWORK/dopo/misure.tsv" | tee "$VMWORK/confronto.md"
          { echo "## Confronto prima/dopo (stesso runner, stessa procedura)"; echo; cat "$VMWORK/confronto.md"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Disco PERSONALE 0.3.0 (senza chiavi né utenti), sicurezza, primo avvio, VMDK
        if: env.FASE != 'base' && inputs.pacchetto && env.rc_prove == '0'
        timeout-minutes: 60
        run: |
          set -euo pipefail
          out=$RUNNER_TEMP/out; mkdir -p "$out"
          bash tests/vm/make_disk.sh localhost/omni-os:nuova "$out" none
          sudo chown "$(id -u):$(id -g)" "$out/disk.raw"
          bash tests/vm/personale_sicurezza.sh "$out/disk.raw" "$TESTKEY.pub" "$VMWORK/sicurezza"
          cat "$VMWORK/sicurezza/sicurezza.md" >> "$GITHUB_STEP_SUMMARY"
          w=$VMWORK/primo-avvio; mkdir -p "$w"
          cp --sparse=always "$out/disk.raw" "$w/disk.raw"
          VM_TABLET=1 bash tests/vm/boot_vm.sh "$w/disk.raw" "$w" uefi
          sleep 180
          python3 tests/vm/qmp.py "$w/qmp.sock" screendump "$w/primo-avvio.png"
          kill "$(cat "$w/qemu.pid")" || true; sleep 3; rm -f "$w/disk.raw"
          sz=$(stat -c %s "$w/primo-avvio.png"); echo "schermata del primo avvio: $sz byte"; [ "$sz" -gt 15000 ]
          { echo "# OMNI OS 0.3.0-desktop-reale: inventario del software"; echo
            echo "## Pacchetti RPM"; $PODMAN run --rm localhost/omni-os:nuova rpm -qa --qf '%{NAME}\t%{VERSION}-%{RELEASE}\t%{ARCH}\n' | LC_ALL=C sort
            echo; echo "## File di OMNI Shell (non da RPM): SHA-256"
            $PODMAN run --rm localhost/omni-os:nuova sh -c 'cd / && find usr/lib/omni-shell usr/bin/omni-shell usr/libexec/omni-os usr/lib/systemd/user/omni-shell*.service usr/lib/systemd/user/plasma-*.d usr/share/wayland-sessions/omni*.desktop usr/share/fonts/omni-inter usr/lib/omni-os -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum'
          } > "$out/inventario-software.txt"
          o=$RUNNER_TEMP/pacchetto; mkdir -p "$o"
          qemu-img convert -p -O vmdk -o subformat=streamOptimized "$out/disk.raw" "$o/OMNI-OS-0.3.0-desktop.vmdk"
          rm -f "$out/disk.raw"
          cp "$out/inventario-software.txt" docs/14-desktop-reale/LEGGIMI.md "$o/"
          cp "$VMWORK/sicurezza/sicurezza.md" "$o/controlli-di-sicurezza.md"
          cp "$VMWORK/dopo-prove/desktop.md" "$o/prove-reali.md"
          [ -f "$VMWORK/confronto.md" ] && cp "$VMWORK/confronto.md" "$o/confronto-prestazioni.md"
          (cd "$o" && sha256sum ./*.vmdk ./*.txt ./*.md > "$RUNNER_TEMP/SHA256SUMS.txt") && mv "$RUNNER_TEMP/SHA256SUMS.txt" "$o/"
          cat "$o/SHA256SUMS.txt"; ls -lh "$o"
          { echo "## Pacchetto"; echo; echo '```'; cat "$o/SHA256SUMS.txt"; ls -lh "$o"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Pacchetto VM 0.3.0 (14 giorni, solo per chi ha accesso al repository)
        if: env.FASE != 'base' && inputs.pacchetto && env.rc_prove == '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: OMNI-OS-0.3.0-desktop-VM
          path: ${{ runner.temp }}/pacchetto/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Evidenze
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: OMNI-OS-desktop-evidenze
          path: |
            ${{ runner.temp }}/vm/prima/schermate/
            ${{ runner.temp }}/vm/prima/*.md
            ${{ runner.temp }}/vm/prima/*.tsv
            ${{ runner.temp }}/vm/prima/*.txt
            ${{ runner.temp }}/vm/prima/*.log
            ${{ runner.temp }}/vm/dopo/schermate/
            ${{ runner.temp }}/vm/dopo/*.md
            ${{ runner.temp }}/vm/dopo/*.tsv
            ${{ runner.temp }}/vm/dopo/*.txt
            ${{ runner.temp }}/vm/dopo/*.log
            ${{ runner.temp }}/vm/dopo-prove/schermate/
            ${{ runner.temp }}/vm/dopo-prove/*.md
            ${{ runner.temp }}/vm/dopo-prove/*.txt
            ${{ runner.temp }}/vm/dopo-prove/*.log
            ${{ runner.temp }}/vm/dopo-prove/*.json
            ${{ runner.temp }}/vm/sicurezza/*.md
            ${{ runner.temp }}/vm/primo-avvio/primo-avvio.png
            ${{ runner.temp }}/vm/confronto.md
            ${{ runner.temp }}/vm/*.log
          retention-days: 14
          if-no-files-found: ignore
      - name: Esito (le prove reali devono passare)
        if: env.FASE != 'base'
        run: |
          echo "prove reali: ${rc_prove:-non eseguite}; misure dopo: ${rc_dopo:-non eseguite}"
          [ "${rc_prove:-1}" = 0 ]
